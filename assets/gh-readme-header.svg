<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I'm Alex. I build desktop apps with C++ and Qt.</title>
  <desc id="desc">A GitHub profile header for Alex, a C++ and Qt desktop developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#edf8f2"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="210" x2="880" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#41cd52"/>
      <stop offset="0.5" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <filter id="shadow" x="60" y="42" width="880" height="176" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="28" fill="url(#bg)"/>
  <g opacity="0.32">
    <path d="M87 74H223" stroke="#2f80ed" stroke-width="2"/>
    <path d="M777 188H914" stroke="#41cd52" stroke-width="2"/>
    <path d="M802 66L842 106L802 146" stroke="#6c5ce7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 146L158 106L198 66" stroke="#41cd52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="52" width="820" height="156" rx="22" fill="white" fill-opacity="0.88"/>
    <rect x="91" y="53" width="818" height="154" rx="21" stroke="#d7e2ee" stroke-width="2"/>
  </g>

  <text x="500" y="111" text-anchor="middle" fill="#111827" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="42" font-weight="700">Hello, I'm Alex.</text>
  <text x="500" y="154" text-anchor="middle" fill="#374151" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="500">I build desktop apps with C++ and Qt</text>
  <rect x="120" y="198" width="760" height="8" rx="4" fill="url(#line)"/>
</svg>
